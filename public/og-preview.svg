    <ellipse cx="900" cy="316" rx="298" ry="190" transform="rotate(24 900 316)" />
    <ellipse cx="900" cy="316" rx="355" ry="220" transform="rotate(-7 900 316)" />
  </g>
  <g fill="#f0c4c4" filter="url(#softGlow)">
    <circle cx="684" cy="256" r="3" /><circle cx="774" cy="150" r="2.5" />
    <circle cx="1043" cy="168" r="3" /><circle cx="1123" cy="331" r="2" />
    <circle cx="1016" cy="465" r="3" /><circle cx="805" cy="484" r="2" />
  </g>
  <circle cx="104" cy="107" r="27" fill="#21171b" stroke="url(#rose)" stroke-width="1.5" />
  <text x="104" y="118" fill="#f8e8e2" font-family="Georgia,serif" font-style="italic" font-size="35" text-anchor="middle">h</text>
  <text x="151" y="112" fill="#f5e7e4" font-family="DM Sans,sans-serif" font-size="13" letter-spacing="4.3">A LITTLE HOPE</text>
  <path d="M78 173h42" stroke="#d9959d" stroke-width="1" />
  <text x="78" y="225" fill="#d6a2a7" font-family="DM Sans,sans-serif" font-size="13" letter-spacing="3.8">A LETTER, HELD CLOSE</text>
  <text x="72" y="329" fill="#fff5f0" font-family="Playfair Display,Georgia,serif" font-size="94" letter-spacing="-4">A Little</text>
  <text x="74" y="428" fill="url(#rose)" font-family="Playfair Display,Georgia,serif" font-style="italic" font-size="108" letter-spacing="-3">Hope.</text>
  <text x="80" y="493" fill="#ddc9c8" font-family="DM Sans,sans-serif" font-size="17" letter-spacing=".4">A quiet place for words and memories.</text>
  <path d="M80 543h1040" stroke="#f1c4bd" stroke-opacity=".19" />
  <text x="80" y="579" fill="#d6a2a7" font-family="DM Sans,sans-serif" font-size="11" letter-spacing="3">SOME FEELINGS ARE MADE OF HOPE</text>
