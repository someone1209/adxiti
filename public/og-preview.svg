<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="72%" cy="48%" r="62%">
      <stop offset="0" stop-color="#6c3346" stop-opacity=".72" />
      <stop offset=".58" stop-color="#25131c" stop-opacity=".34" />
      <stop offset="1" stop-color="#0b080b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1c4bd" />
      <stop offset="1" stop-color="#d98c9a" />
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      @font-face { font-family: "Playfair Display"; src: url("./fonts/playfair-display-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "Playfair Display"; src: url("./fonts/playfair-display-latin-wght-italic.woff2") format("woff2"); font-style: italic; font-weight: 400 900; }
      @font-face { font-family: "DM Sans"; src: url("./fonts/dm-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#0b080b" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <g fill="none" stroke="url(#rose)" stroke-opacity=".22">
